# Keymap-drawer input. Each layer follows the keyboard's 76 physical positions.
# Empty keys are disabled; ▽ inherits the active lower layer.
# Small top-right symbols show the output with Shift or GUI held.
# Switch keys select a layer; hold keys temporarily activate one.

